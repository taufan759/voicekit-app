[package]
name = "voicekit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "VoiceKit: studio text-to-speech ala ElevenLabs v4 untuk konten"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "native-tls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
